<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="with=device-width, initial-scale=1">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <main>
            <h1>Expense Tracker</h1>
            <form id="expense-form">
                <input type="number" id="amount" placeholder="Amount" step="0.01" min="0.01" required>
                <input type="text" id="category" placeholder="Category (e.g. Food)" required>
                <input type="text" id="description" placeholder="Description (optional)">
                <input type="date" id="date" required>
                <button type="submit">Add expense</button>
            </form>

            <p id="message"></p>

            <h2>Your expenses</h2>
            <ul id="expense-list"></ul>
        </main>
        <script src="/static/app.js"></script>
    </body>
</html>
